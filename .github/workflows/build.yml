name: Build Android & Wear OS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: Phone flavor (the watch app is built to pair with it)
        type: choice
        default: play
        options:
          - play
          - alpha
          - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLAVOR: ${{ inputs.flavor || 'play' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK; make sure AGP may download missing parts.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # The phone and the watch must share applicationId + signing key to talk to each other
      # through the Wearable Data Layer, so both flavors/suffixes are derived from one input.
      - name: Resolve flavor
        run: |
          case "$FLAVOR" in
            play)  echo "TASK_FLAVOR=Play"  >> "$GITHUB_ENV"; echo "ID_SUFFIX="       >> "$GITHUB_ENV" ;;
            alpha) echo "TASK_FLAVOR=Alpha" >> "$GITHUB_ENV"; echo "ID_SUFFIX=.alpha" >> "$GITHUB_ENV" ;;
            dev)   echo "TASK_FLAVOR=Dev"   >> "$GITHUB_ENV"; echo "ID_SUFFIX=.dev"   >> "$GITHUB_ENV" ;;
          esac

      # Optional: with the ANDROID_KEYSTORE_* secrets both APKs are signed with your own stable key
      # (so later builds update the installed apps). Without them, the runner's debug key is used:
      # fine, but only APKs from the same run can talk to each other.
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            mkdir -p ~/.gradle
            {
              echo "android.injected.signing.store.file=$RUNNER_TEMP/release.jks"
              echo "android.injected.signing.store.password=$KEYSTORE_PASSWORD"
              echo "android.injected.signing.key.alias=$KEY_ALIAS"
              echo "android.injected.signing.key.password=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> ~/.gradle/gradle.properties
          fi

      - name: Build phone + watch
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace --continue \
            -Pwear.applicationIdSuffix="$ID_SUFFIX" \
            :shared:wearsync:test \
            :wear:assembleDebug \
            ":app:assemble${TASK_FLAVOR}ProdDebug"

      - uses: actions/upload-artifact@v4
        with:
          name: android-phone-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: wear-os-apk
          path: wear/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Raw .apk files (no zip) on a rolling pre-release, installable straight from the phone's browser.
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      FLAVOR: ${{ inputs.flavor || 'play' }}
      GH_TOKEN: ${{ github.token }}
      TAG: latest-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-phone-apk
          path: dl/phone

      - uses: actions/download-artifact@v4
        with:
          name: wear-os-apk
          path: dl/wear

      - name: Publish release
        run: |
          mkdir out
          cp "$(find dl/phone -name '*.apk' | head -n 1)" "out/ProtonAuthenticator-phone-$FLAVOR-debug.apk"
          cp "$(find dl/wear -name '*.apk' | head -n 1)" "out/ProtonAuthenticator-wear-debug.apk"
          cat > notes.md <<NOTES
          Build of ${GITHUB_SHA::7} (branch \`$GITHUB_REF_NAME\`, run #$GITHUB_RUN_NUMBER).

          - \`ProtonAuthenticator-phone-$FLAVOR-debug.apk\`: install on the **phone**.
          - \`ProtonAuthenticator-wear-debug.apk\`: install on the **watch** (adb over Wi-Fi), never on the phone.

          Install both from the same release: they must share the same signing key to sync through the Wearable Data Layer.
          NOTES
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build (run #$GITHUB_RUN_NUMBER)" \
            --notes-file notes.md
