name: Build Android & Wear OS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Keep the same debug signing key from run to run, so a new build can update the installed apps
      # (a fresh key every run forces an uninstall first). Superseded by the ANDROID_KEYSTORE_* secrets.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      # The runner image already ships the Android SDK; make sure AGP may download missing parts.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Optional: with the ANDROID_KEYSTORE_* secrets both APKs are signed with your own stable key
      # (so later builds update the installed apps). Without them, the runner's debug key is used:
      # fine, but only APKs from the same run can talk to each other.
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            mkdir -p ~/.gradle
            {
              echo "android.injected.signing.store.file=$RUNNER_TEMP/release.jks"
              echo "android.injected.signing.store.password=$KEYSTORE_PASSWORD"
              echo "android.injected.signing.key.alias=$KEY_ALIAS"
              echo "android.injected.signing.key.password=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> ~/.gradle/gradle.properties
          fi

      # Two phone/watch pairs, each with its own applicationId (the Wearable Data Layer only links
      # apps sharing id + signing key):
      #  - play : proton.android.authenticator       (same id as the Play Store app, uninstall that one first)
      #  - alpha: proton.android.authenticator.alpha (can live next to the Play Store app)
      - name: Build play pair
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace --continue \
            :shared:wearsync:test \
            :wear:assembleDebug \
            :app:assemblePlayProdDebug
          mkdir -p apks/phone apks/wear
          cp "$(find app/build/outputs/apk/playProd -name '*.apk' | head -n 1)" apks/phone/ProtonAuthenticator-phone-play-debug.apk
          cp "$(find wear/build/outputs/apk -name '*.apk' | head -n 1)" apks/wear/ProtonAuthenticator-wear-play-debug.apk

      - name: Build alpha pair
        run: |
          ./gradlew --stacktrace --continue \
            -Pwear.applicationIdSuffix=.alpha \
            :wear:assembleDebug \
            :app:assembleAlphaProdDebug
          cp "$(find app/build/outputs/apk/alphaProd -name '*.apk' | head -n 1)" apks/phone/ProtonAuthenticator-phone-alpha-debug.apk
          cp "$(find wear/build/outputs/apk -name '*.apk' | head -n 1)" apks/wear/ProtonAuthenticator-wear-alpha-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-phone-apk
          path: apks/phone/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: wear-os-apk
          path: apks/wear/*.apk
          if-no-files-found: error

  # Raw .apk files (no zip) on a rolling pre-release, installable straight from the phone's browser.
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: latest-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-phone-apk
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: wear-os-apk
          path: out

      - name: Publish release
        run: |
          cat > notes.md <<NOTES
          Build of ${GITHUB_SHA::7} (branch \`$GITHUB_REF_NAME\`, run #$GITHUB_RUN_NUMBER).

          Install a **phone** APK on the phone and the **wear** APK with the same name suffix on the watch (adb over Wi-Fi, never on the phone). Both must come from this release: they share the same signing key and application id, which the Wearable Data Layer requires.

          - \`play\`: application id \`proton.android.authenticator\`, same as the Play Store app (uninstall it first).
          - \`alpha\`: application id \`proton.android.authenticator.alpha\`, installs next to the Play Store app.
          NOTES
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build (run #$GITHUB_RUN_NUMBER)" \
            --notes-file notes.md

  # Boots the phone APK on an emulator and keeps logcat + a screenshot, to catch start-up crashes.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-phone-apk
          path: dl/phone

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/smoke-test.sh dl/phone/ProtonAuthenticator-phone-play-debug.apk smoke-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-logs-api${{ matrix.api-level }}
          path: smoke-out
          if-no-files-found: warn
