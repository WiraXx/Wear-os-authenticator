name: Build Android & Wear OS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: Phone flavor (the watch app is built to pair with it)
        type: choice
        default: play
        options:
          - play
          - alpha
          - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLAVOR: ${{ inputs.flavor || 'play' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The phone and the watch must share applicationId + signing key to talk to each other
      # through the Wearable Data Layer, so both flavors/suffixes are derived from one input.
      - name: Resolve flavor
        run: |
          case "$FLAVOR" in
            play)  echo "TASK_FLAVOR=Play"  >> "$GITHUB_ENV"; echo "ID_SUFFIX="       >> "$GITHUB_ENV" ;;
            alpha) echo "TASK_FLAVOR=Alpha" >> "$GITHUB_ENV"; echo "ID_SUFFIX=.alpha" >> "$GITHUB_ENV" ;;
            dev)   echo "TASK_FLAVOR=Dev"   >> "$GITHUB_ENV"; echo "ID_SUFFIX=.dev"   >> "$GITHUB_ENV" ;;
          esac

      # Optional: with the ANDROID_KEYSTORE_* secrets both APKs are signed with your own stable key
      # (so later builds update the installed apps). Without them, the runner's debug key is used:
      # fine, but only APKs from the same run can talk to each other.
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            mkdir -p ~/.gradle
            {
              echo "android.injected.signing.store.file=$RUNNER_TEMP/release.jks"
              echo "android.injected.signing.store.password=$KEYSTORE_PASSWORD"
              echo "android.injected.signing.key.alias=$KEY_ALIAS"
              echo "android.injected.signing.key.password=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> ~/.gradle/gradle.properties
          fi

      - name: Build phone + watch
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace \
            -Pwear.applicationIdSuffix="$ID_SUFFIX" \
            :shared:wearsync:test \
            ":app:assemble${TASK_FLAVOR}ProdDebug" \
            :wear:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android-phone-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: wear-os-apk
          path: wear/build/outputs/apk/**/*.apk
          if-no-files-found: error
